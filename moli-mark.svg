<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="MOLI">
  <title>MOLI</title>
  <!-- Line-art wolf head as the leading mark, integrated with letterforms -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wolf head (left) -->
    <path stroke-width="2.2" d="
      M 28 50
      C 18 46, 10 36, 12 26
      C 8 18, 12 10, 22 8
      C 28 4, 36 4, 42 8
      C 52 10, 56 18, 52 26
      C 54 36, 46 46, 36 50
      Z"/>
    <!-- Inner face plane -->
    <path stroke-width="1.6" d="
      M 22 22
      C 26 16, 38 16, 42 22
      C 44 28, 40 34, 32 36
      C 24 34, 20 28, 22 22
      Z"/>
    <!-- Ears -->
    <path stroke-width="2" d="M 18 14 L 14 4 L 26 12"/>
    <path stroke-width="2" d="M 46 14 L 50 4 L 38 12"/>
    <!-- Eyes -->
    <path stroke-width="1.8" d="M 24 24 L 28 25"/>
    <path stroke-width="1.8" d="M 40 24 L 36 25"/>
    <!-- Bridge / muzzle -->
    <path stroke-width="1.6" d="M 32 28 L 32 34"/>
    <path stroke-width="1.6" d="M 28 36 Q 32 40 36 36"/>
    <!-- Subtle cheek lines -->
    <path stroke-width="1.3" d="M 18 30 Q 14 34 16 40"/>
    <path stroke-width="1.3" d="M 46 30 Q 50 34 48 40"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="42"
        font-family="Archivo Narrow, Arial Narrow, sans-serif"
        font-size="28"
        font-weight="700"
        letter-spacing="0.28em"
        fill="currentColor">MOLI</text>
  <!-- Soft accent dot (matches brand span) -->
  <circle cx="198" cy="38" r="3.2" fill="currentColor" opacity="0.85"/>
</svg>
